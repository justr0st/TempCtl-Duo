# Release (spec 9.13, 9.22): every push to main builds the four firmware images and the desktop app and
# publishes them with the page on GitHub Pages (https://justr0st.github.io/TempCtl-Duo/, files under /dl/, list in
# /dl/manifest.json; the wiki under /wiki/, the browser demo under /demo/). The device's web page (all boards)
# and the S3 itself read the list to offer updates. A new version (FW_VERSION in src/version.h without a tag
# v<version> yet) also becomes a GitHub release with the same files; a push without a version change only updates
# the page.
# Setup: Settings > Pages > Source: GitHub Actions (a public repository).
# Transition (devices with 1.0.65 or older ask the Cloudflare page): while the secrets CLOUDFLARE_API_TOKEN (a
# token with the template "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID exist, the same files also go to
# https://tempctl-duo.just-r0st.workers.dev (Workers Builds there switched off). Remove the secrets to stop that.
name: Release

on:
  push:
    branches: [main]
    # (the wiki, docs/wiki, is part of the hosted page: its changes deploy too)
    paths-ignore: ["claude/**", "hardware/**", "logo/**", "README.md", "docs/SPEC.md", ".vscode/**"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write   # the GitHub release (tag + files)
  pages: write      # GitHub Pages
  id-token: write   # (deploy-pages)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      ENVS: s3 cyd-1xlocal-1x485 cyd-2xlocal cyd-2xlocal-2x485
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # (the release notes: the commits since the last release tag)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: PlatformIO cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Tools
        run: pip install "platformio>=6.1.16,<6.2" "esptool==4.8.1"

      - name: Firmware
        run: |
          args=""; for e in $ENVS; do args="$args -e $e"; done
          pio run $args

      - name: Firmware files (update image + full image for the first USB flash)
        run: |
          set -e
          BA=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          for e in $ENVS; do
            B=.pio/build/$e; O=art/fw/$e; mkdir -p $O
            cp $B/firmware.bin $O/firmware.bin
            if [ "$e" = s3 ]; then
              CHIP="--chip esp32s3"; FL="--flash_mode qio --flash_freq 80m --flash_size 16MB"; BOOT=0x0
            else
              CHIP="--chip esp32"; FL="--flash_mode dio --flash_freq 40m --flash_size 4MB"; BOOT=0x1000
            fi
            esptool.py $CHIP merge_bin -o $O/full.bin $FL \
              $BOOT $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $BA 0x10000 $B/firmware.bin
          done
          ls -l art/fw/*

      - name: Browser demo (the firmware's control code as WebAssembly, demo/)
        run: |
          curl -sSL -o /tmp/wasi-sdk.tgz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          tar -xzf /tmp/wasi-sdk.tgz -C /tmp
          WASI_SDK=/tmp/wasi-sdk-24.0-x86_64-linux bash demo/build.sh

      - name: Desktop app
        run: |
          bash tools/launcher/build.sh all
          mkdir -p art/app && cp tools/launcher/dist/* art/app/
          ls -l art/app

      - name: Page + release files
        run: |
          python3 tools/build_site.py dist --web
          python3 tools/release.py dist art
          cat dist/dl/manifest.json

      - name: Keep the files (14 days)
        uses: actions/upload-artifact@v4
        with:
          name: tempctl-duo-release
          path: dist/dl
          retention-days: 14

      - name: Upload the page (GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy the page (GitHub Pages)
        id: pages
        uses: actions/deploy-pages@v4

      - name: GitHub release (a new version only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^#define FW_VERSION "\(.*\)".*/\1/p' src/version.h | tr -d '\r')
          if gh release view "v$V" >/dev/null 2>&1; then echo "release v$V exists: only the page was updated"; exit 0; fi
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## Changes"
            if [ -n "$PREV" ]; then git log --no-merges --format='- %s' "$PREV..HEAD"; else git log -1 --format='- %s'; fi
            echo
            echo "## Files"
            echo "- \`tempctl-duo-$V-<board>.bin\`: firmware update (web page *Settings › Firmware update*, SD card on the S3)"
            echo "- \`tempctl-duo-$V-<board>-full.bin\`: first install over USB, written at address 0x0"
            echo "- desktop app: Windows \`.exe\`, macOS \`.zip\`, Linux \`.tar.gz\`"
            echo
            echo "Boards: \`s3\` (ESP32-S3), \`cyd-1xlocal-1x485\`, \`cyd-2xlocal\`, \`cyd-2xlocal-2x485\` (CYD wirings A, B, C)."
            echo "How to update: https://justr0st.github.io/TempCtl-Duo/wiki/Updates-and-backups.html"
          } > /tmp/notes.md
          cat /tmp/notes.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "TempCtl Duo $V" --notes-file /tmp/notes.md \
            $(ls dist/dl/* | grep -v manifest.json)

      - name: Deploy to Cloudflare (transition)
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # the deployment list in Cloudflare shows the version (tag) and the commit's first line (message, max. 100)
        run: |
          V=$(sed -n 's/^#define FW_VERSION "\(.*\)".*/\1/p' src/version.h | tr -d '\r')
          MSG=$(git log -1 --format=%s | cut -c1-100)
          npx --yes wrangler@4 deploy --tag "v$V" --message "$MSG"
