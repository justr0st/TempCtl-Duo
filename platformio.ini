; TempCtl Duo: two-channel temperature profile controller.
; Boards: env s3  = ESP32-S3-DevKitC-1 v1.0 N16R8 + 4.0" ST7796 / FT6336U module (main target)
;         env cyd = ESP32-2432S028R "Cheap Yellow Display" (second supported device)
; Board differences (pins, display, touch, LED) live in src/board_s3.h / src/board_cyd.h.
[platformio]
default_envs = s3

[env]
platform = espressif32@6.9.0        ; Arduino-ESP32 core 2.0.17
framework = arduino
monitor_speed = 115200
; decodes crash backtraces in the serial monitor (needs the matching build)
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; embeds web/index.html (gzip) and the web fonts into src/web_assets.h
extra_scripts = pre:tools/web_embed.py

lib_deps =
  ; If the registry lookup fails use: https://github.com/lvgl/lvgl.git#v9.6.0
  lvgl/lvgl@9.6.0
  bblanchon/ArduinoJson@^7.3.0

build_flags =
  -Os
  -I include
  -D LV_CONF_INCLUDE_SIMPLE
  ; the touch UI fonts (src/fonts) include "lvgl.h" instead of "lvgl/lvgl.h"
  -D LV_LVGL_H_INCLUDE_SIMPLE

; ESP32-S3-DevKitC-1 v1.0 N16R8: 16 MB quad flash, 8 MB octal PSRAM.
; Flashing and log monitor: the board's "UART" USB port (USB-to-UART bridge,
; UART0 on GPIO 43/44). The native "USB" port is the control port (serial
; console / Web Serial page, later): USB-OTG mode with TinyUSB
; (ARDUINO_USB_MODE=0), so opening it never resets the chip.
[env:s3]
board = esp32-s3-devkitc-1
; COM port of the "UART" USB port on Rost's PC (change if needed)
upload_port = COM6
monitor_port = COM6
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; same as the board definition, but USB-OTG (TinyUSB) instead of USB Serial/JTAG
board_build.extra_flags = -DARDUINO_ESP32S3_DEV -DARDUINO_USB_MODE=0 -DARDUINO_RUNNING_CORE=1 -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
  ${env.build_flags}
  -D BOARD_S3
  -D BOARD_HAS_PSRAM
  ; Serial = UART0 ("UART" port): log + exception decoder
  -D ARDUINO_USB_CDC_ON_BOOT=0

; ESP32-2432S028R "CYD" (ESP32, 4 MB flash, no PSRAM). Two wirings, one env each
; (src/board_cyd.h, claude/wiring/cyd-wiring-a.png / -b.png / -c.png):
;   cyd-1xlocal-1x485  RS485 on P3/CN1 + one local channel (thermocouple + SSR) on the SD slot pins
;   cyd-2xlocal        two local channels, no RS485
;   cyd-2xlocal-2x485  RS485 + two local channels (on-board RGB LED removed, external WS2812 on IO17)
[cyd]
board = esp32dev
upload_port = COM6
monitor_port = COM6
; two 1.875 MB firmware slots (updates over Wi-Fi) + 192 kB file system; the change from huge_app.csv
; erases settings and programs once (back them up first: web page, Tools)
board_build.partitions = partitions_cyd_ota.csv
lib_deps =
  ${env.lib_deps}
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
  ${env.build_flags}
  -D BOARD_CYD

[env:cyd-1xlocal-1x485]
extends = cyd
build_flags =
  ${cyd.build_flags}
  -D CYD_1XLOCAL_1X485

[env:cyd-2xlocal]
extends = cyd
build_flags =
  ${cyd.build_flags}
  -D CYD_2XLOCAL

[env:cyd-2xlocal-2x485]
extends = cyd
build_flags =
  ${cyd.build_flags}
  -D CYD_2XLOCAL_2X485
