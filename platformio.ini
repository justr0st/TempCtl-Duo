; ESP32-2432S028R "Cheap Yellow Display" + RS485 -> PMA KS 4x-1 / generic Modbus RTU controller
[env:cyd]
platform = espressif32@6.9.0        ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

; embeds the LVGL Pro project (ui/*.xml) into src/ui_xml_data.h before each build
extra_scripts = pre:scripts/embed_ui_xml.py

lib_deps =
  ; 9.4 is the last LVGL release with the runtime XML loader (LV_USE_XML).
  ; If the registry lookup fails use: https://github.com/lvgl/lvgl.git#v9.4.0
  lvgl/lvgl@9.4.0
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  bblanchon/ArduinoJson@^7.2.0

build_flags =
  -Os
  -I include
  -D LV_CONF_INCLUDE_SIMPLE
  ; ---- TFT_eSPI setup for the CYD (ILI9341, HSPI) ----
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  ; Some newer CYD boards (2 USB ports) use ST7789: replace the line above with
  ; -D ST7789_DRIVER=1 and add -D TFT_INVERSION_OFF=1 if colours look inverted.
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
