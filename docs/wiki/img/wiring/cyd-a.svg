<text x="16" y="618" class="s">SD-slot pins: plug a micro-SD breakout (&quot;sniffer&quot;) adapter into the slot, no card. IO5 has the board&#x27;s SD pull-up; IO18 has none.</text>
<text x="16" y="636" class="s">No E-stop input, no SSR supply relay and no chip temperature on the CYD (no free pins).</text>
