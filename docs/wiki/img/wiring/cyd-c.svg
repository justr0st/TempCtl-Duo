<text x="16" y="1106" class="s">SD-slot pins: plug a micro-SD breakout (&quot;sniffer&quot;) adapter into the slot, no card. IO5 has the board&#x27;s SD pull-up; IO18 has none.</text>
<text x="16" y="1124" class="s">LED pads: use the pads that go to the ESP32 pins, not the ones to the 1 kΩ resistors (check with an ohmmeter).</text>
