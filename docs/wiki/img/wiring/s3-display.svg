<text x="462" y="475.5">SD_CS</text>
<text x="16" y="518" class="s">VCC 5 V recommended (backlight ≈ 100 mA); the logic is 3.3 V. MISO is read back by the automatic screen check.</text>
<text x="16" y="536" class="s">The display&#x27;s micro-SD slot holds the run logs, firmware.bin for an update and the backups (FAT32).</text>
