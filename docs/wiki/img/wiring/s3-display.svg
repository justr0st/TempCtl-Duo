<text x="222" y="449.5" text-anchor="end">J1-7  GPIO7</text>
<line x1="236" y1="445.0" x2="450" y2="445.0" stroke="var(--lcd)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="445.0" r="4" class="pin" stroke="var(--lcd)"/>
<text x="343.0" y="440.0" class="w" text-anchor="middle" style="fill:var(--lcd)">touch INT</text>
<circle cx="450" cy="445.0" r="4" class="pin" stroke="var(--lcd)"/>
