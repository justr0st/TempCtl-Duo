<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 574" width="980" height="574" font-family="Barlow, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<style>svg{--bg:#ffffff;--box:#f5f7fa;--line:#c5ccd6;--text:#1c2430;--muted:#5d6b7c;--board:#fff8e1;--boardl:#e0b84a;--3v3:#d32f2f;--5v:#8e24aa;--gnd:#37474f;--lcd:#5e35b1;--rs485:#1565c0;--tc:#2e7d32;--ssr:#e65100;--safe:#c2185b;--led:#00838f;--field:#546e7a}@media (prefers-color-scheme:dark){svg{--bg:#12161c;--box:#1c222b;--line:#3a4452;--text:#e6ebf2;--muted:#94a3b5;--board:#2a2414;--boardl:#8a7330;--3v3:#ff6b6b;--5v:#ce93d8;--gnd:#b0bec5;--lcd:#b39ddb;--rs485:#64b5f6;--tc:#81c784;--ssr:#ffb74d;--safe:#f48fb1;--led:#4dd0e1;--field:#90a4ae}}text{fill:var(--text);font-size:13px}.m{fill:var(--muted);font-size:11.5px}.t{font-size:15px;font-weight:700}.h{font-size:19px;font-weight:700}.s{font-size:12.5px;fill:var(--muted)}.w{font-size:11.5px;font-weight:700}.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}.brd{fill:var(--board);stroke:var(--boardl);stroke-width:1.5}.pin{fill:var(--bg);stroke-width:1.6}</style>
<rect width="980" height="574" rx="14" fill="var(--bg)"/>
<text x="16" y="30" class="h">S3: display module (4.0&quot; ST7796S + FT6336U touch)</text>
<text x="16" y="52" class="s">Pin names as printed on the module; keep the SPI wires short (80 MHz: GPIO 10–13 are the IO-MUX pins)</text>
<rect x="16" y="74" width="220" height="418" rx="10" class="brd"/>
<text x="30" y="96" class="t">ESP32-S3-DevKitC-1</text>
<text x="30" y="112" class="m">v1.0 N16R8 · J1 left, J3 right header</text>
<rect x="450" y="74" width="230" height="418" rx="10" class="box"/>
<text x="565.0" y="94" class="t" text-anchor="middle">4.0&quot; SPI display</text>
<text x="565.0" y="110" class="m" text-anchor="middle">MSP4031, 14-pin header</text>
<text x="222" y="137.5" text-anchor="end">J1-21  5V</text>
<line x1="236" y1="133.0" x2="450" y2="133.0" stroke="var(--5v)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="133.0" r="4" class="pin" stroke="var(--5v)"/>
