<text x="16" y="696" class="s">The pull-ups keep the converters deselected while the ESP32 boots. Twisted, screened thermocouple wire; screen to GND at one end.</text>
<text x="16" y="714" class="s">The third converter (monitor channel) is shown on the chart and logged only: no output, no alarm (Channels › third tab).</text>
<text x="16" y="732" class="s">IEC colours: type K + green / − white; ANSI: + yellow / − red. A reading that falls when heating: swap T+ and T−.</text>
</svg>
