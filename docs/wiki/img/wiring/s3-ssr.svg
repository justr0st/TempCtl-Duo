<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 588" width="980" height="588" font-family="Barlow, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<style>svg{--bg:#ffffff;--box:#f5f7fa;--line:#c5ccd6;--text:#1c2430;--muted:#5d6b7c;--board:#fff8e1;--boardl:#e0b84a;--3v3:#d32f2f;--5v:#8e24aa;--gnd:#37474f;--lcd:#5e35b1;--rs485:#1565c0;--tc:#2e7d32;--ssr:#e65100;--safe:#c2185b;--led:#00838f;--field:#546e7a}@media (prefers-color-scheme:dark){svg{--bg:#12161c;--box:#1c222b;--line:#3a4452;--text:#e6ebf2;--muted:#94a3b5;--board:#2a2414;--boardl:#8a7330;--3v3:#ff6b6b;--5v:#ce93d8;--gnd:#b0bec5;--lcd:#b39ddb;--rs485:#64b5f6;--tc:#81c784;--ssr:#ffb74d;--safe:#f48fb1;--led:#4dd0e1;--field:#90a4ae}}text{fill:var(--text);font-size:13px}.m{fill:var(--muted);font-size:11.5px}.t{font-size:15px;font-weight:700}.h{font-size:19px;font-weight:700}.s{font-size:12.5px;fill:var(--muted)}.w{font-size:11.5px;font-weight:700}.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}.brd{fill:var(--board);stroke:var(--boardl);stroke-width:1.5}.pin{fill:var(--bg);stroke-width:1.6}</style>
<rect width="980" height="588" rx="14" fill="var(--bg)"/>
<text x="16" y="30" class="h">S3: SSR drivers, SSRs and the SSR supply relay</text>
<text x="16" y="52" class="s">Each SSR input is switched by an NPN transistor; the relay switches the +5 V of both SSR inputs</text>
<rect x="16" y="74" width="220" height="414" rx="10" class="brd"/>
<text x="30" y="96" class="t">ESP32-S3-DevKitC-1</text>
<text x="30" y="112" class="m">v1.0 N16R8 · J1 left, J3 right header</text>
<rect x="450" y="74" width="230" height="132" rx="10" class="box"/>
<text x="565.0" y="94" class="t" text-anchor="middle">SSR driver, bottom</text>
<text x="565.0" y="110" class="m" text-anchor="middle">NPN (BC337 / 2N2222)</text>
<text x="222" y="137.5" text-anchor="end">J3-18  GPIO21</text>
<line x1="236" y1="133.0" x2="450" y2="133.0" stroke="var(--ssr)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="133.0" r="4" class="pin" stroke="var(--ssr)"/>
<text x="343.0" y="128.0" class="w" text-anchor="middle" style="fill:var(--ssr)">SSR bottom</text>
<circle cx="450" cy="133.0" r="4" class="pin" stroke="var(--ssr)"/>
<text x="462" y="137.5">IN → 1 kΩ → base</text>
<text x="222" y="163.5" text-anchor="end">J3-22  GND</text>
<line x1="236" y1="159.0" x2="450" y2="159.0" stroke="var(--gnd)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="159.0" r="4" class="pin" stroke="var(--gnd)"/>
<circle cx="450" cy="159.0" r="4" class="pin" stroke="var(--gnd)"/>
<text x="462" y="163.5">base → 10 kΩ → GND</text>
<text x="222" y="189.5" text-anchor="end">J3-22  GND</text>
<line x1="236" y1="185.0" x2="450" y2="185.0" stroke="var(--gnd)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="185.0" r="4" class="pin" stroke="var(--gnd)"/>
<circle cx="450" cy="185.0" r="4" class="pin" stroke="var(--gnd)"/>
<text x="462" y="189.5">emitter</text>
<rect x="800" y="74" width="165" height="132" rx="10" class="box"/>
<text x="882.5" y="94" class="t" text-anchor="middle">SSR, bottom</text>
<text x="882.5" y="110" class="m" text-anchor="middle">DC input 3–32 V, zero-cross</text>
<text x="668" y="137.5" text-anchor="end">collector</text>
<line x1="680" y1="133.0" x2="800" y2="133.0" stroke="var(--ssr)" stroke-width="2.6"/>
<circle cx="680" cy="133.0" r="4" class="pin" stroke="var(--ssr)"/>
<circle cx="800" cy="133.0" r="4" class="pin" stroke="var(--ssr)"/>
<text x="812" y="137.5">− input</text>
<line x1="740" y1="159.0" x2="800" y2="159.0" stroke="var(--5v)" stroke-width="2.6"/>
<text x="734" y="163.5" class="w" text-anchor="end" style="fill:var(--5v)">5 V relay</text>
<circle cx="800" cy="159.0" r="4" class="pin" stroke="var(--5v)"/>
<text x="812" y="163.5">+ input</text>
<rect x="450" y="228" width="230" height="132" rx="10" class="box"/>
<text x="565.0" y="248" class="t" text-anchor="middle">SSR driver, top</text>
<text x="565.0" y="264" class="m" text-anchor="middle">NPN (BC337 / 2N2222)</text>
<text x="222" y="291.5" text-anchor="end">J3-17  GPIO47</text>
<line x1="236" y1="287.0" x2="450" y2="287.0" stroke="var(--ssr)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="287.0" r="4" class="pin" stroke="var(--ssr)"/>
<text x="343.0" y="282.0" class="w" text-anchor="middle" style="fill:var(--ssr)">SSR top</text>
<circle cx="450" cy="287.0" r="4" class="pin" stroke="var(--ssr)"/>
<text x="462" y="291.5">IN (1 kΩ to base)</text>
<text x="222" y="317.5" text-anchor="end">J3-21  GND</text>
<line x1="236" y1="313.0" x2="450" y2="313.0" stroke="var(--gnd)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="313.0" r="4" class="pin" stroke="var(--gnd)"/>
<circle cx="450" cy="313.0" r="4" class="pin" stroke="var(--gnd)"/>
<text x="462" y="317.5">10 kΩ base–GND</text>
<text x="222" y="343.5" text-anchor="end">J3-21  GND</text>
<line x1="236" y1="339.0" x2="450" y2="339.0" stroke="var(--gnd)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="339.0" r="4" class="pin" stroke="var(--gnd)"/>
<circle cx="450" cy="339.0" r="4" class="pin" stroke="var(--gnd)"/>
<text x="462" y="343.5">emitter</text>
<rect x="800" y="228" width="165" height="132" rx="10" class="box"/>
<text x="882.5" y="248" class="t" text-anchor="middle">SSR, top</text>
<text x="882.5" y="264" class="m" text-anchor="middle">DC input 3–32 V, zero-cross</text>
<text x="668" y="291.5" text-anchor="end">collector</text>
<line x1="680" y1="287.0" x2="800" y2="287.0" stroke="var(--ssr)" stroke-width="2.6"/>
<circle cx="680" cy="287.0" r="4" class="pin" stroke="var(--ssr)"/>
<circle cx="800" cy="287.0" r="4" class="pin" stroke="var(--ssr)"/>
<text x="812" y="291.5">− input</text>
<line x1="740" y1="313.0" x2="800" y2="313.0" stroke="var(--5v)" stroke-width="2.6"/>
<text x="734" y="317.5" class="w" text-anchor="end" style="fill:var(--5v)">5 V relay</text>
<circle cx="800" cy="313.0" r="4" class="pin" stroke="var(--5v)"/>
<text x="812" y="317.5">+ input</text>
<rect x="450" y="382" width="230" height="106" rx="10" class="box"/>
<text x="565.0" y="402" class="t" text-anchor="middle">SSR supply relay</text>
<text x="565.0" y="418" class="m" text-anchor="middle">DC solid-state relay, active high</text>
<text x="222" y="445.5" text-anchor="end">J1-4  GPIO4</text>
<line x1="236" y1="441.0" x2="450" y2="441.0" stroke="var(--safe)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="441.0" r="4" class="pin" stroke="var(--safe)"/>
<text x="343.0" y="436.0" class="w" text-anchor="middle" style="fill:var(--safe)">RELAY</text>
<circle cx="450" cy="441.0" r="4" class="pin" stroke="var(--safe)"/>
<text x="462" y="445.5">IN +</text>
<text x="222" y="471.5" text-anchor="end">J1-22  GND</text>
<line x1="236" y1="467.0" x2="450" y2="467.0" stroke="var(--gnd)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="467.0" r="4" class="pin" stroke="var(--gnd)"/>
<circle cx="450" cy="467.0" r="4" class="pin" stroke="var(--gnd)"/>
<text x="462" y="471.5">IN −</text>
<rect x="800" y="382" width="165" height="106" rx="10" class="box"/>
<text x="882.5" y="402" class="t" text-anchor="middle">both SSR + inputs</text>
<text x="882.5" y="418" class="m" text-anchor="middle">&quot;5 V relay&quot;</text>
<text x="668" y="445.5" text-anchor="end">OUT +</text>
<line x1="680" y1="441.0" x2="800" y2="441.0" stroke="var(--5v)" stroke-width="2.6"/>
<circle cx="680" cy="441.0" r="4" class="pin" stroke="var(--5v)"/>
<text x="740.0" y="436.0" class="w" text-anchor="middle" style="fill:var(--5v)">5 V (J1-21)</text>
<text x="668" y="471.5" text-anchor="end">OUT −</text>
<line x1="680" y1="467.0" x2="800" y2="467.0" stroke="var(--5v)" stroke-width="2.6"/>
<circle cx="680" cy="467.0" r="4" class="pin" stroke="var(--5v)"/>
<text x="740.0" y="462.0" class="w" text-anchor="middle" style="fill:var(--5v)">5 V relay</text>
<circle cx="800" cy="467.0" r="4" class="pin" stroke="var(--5v)"/>
<text x="812" y="471.5">+ inputs</text>
<text x="16" y="514" class="s">The 10 kΩ base pull-downs keep the SSRs off during reset and flashing. Relay: input ≤ 20 mA at 3.3 V, output ≥ 0.5 A DC.</text>
<text x="16" y="532" class="s">The relay is on only while a local channel heats; off at once on a fault or E-stop. A shorted SSR output still needs a contactor.</text>
<text x="16" y="550" class="s">Load side (mains, not drawn): L – fuse – SSR 1/2 – heater – N. Setting safety.relay off only when no relay is fitted.</text>
</svg>
