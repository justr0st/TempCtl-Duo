<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 358" width="980" height="358" font-family="Barlow, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<style>svg{--bg:#ffffff;--box:#f5f7fa;--line:#c5ccd6;--text:#1c2430;--muted:#5d6b7c;--board:#fff8e1;--boardl:#e0b84a;--3v3:#d32f2f;--5v:#8e24aa;--gnd:#37474f;--lcd:#5e35b1;--rs485:#1565c0;--tc:#2e7d32;--ssr:#e65100;--safe:#c2185b;--led:#00838f;--field:#546e7a}@media (prefers-color-scheme:dark){svg{--bg:#12161c;--box:#1c222b;--line:#3a4452;--text:#e6ebf2;--muted:#94a3b5;--board:#2a2414;--boardl:#8a7330;--3v3:#ff6b6b;--5v:#ce93d8;--gnd:#b0bec5;--lcd:#b39ddb;--rs485:#64b5f6;--tc:#81c784;--ssr:#ffb74d;--safe:#f48fb1;--led:#4dd0e1;--field:#90a4ae}}text{fill:var(--text);font-size:13px}.m{fill:var(--muted);font-size:11.5px}.t{font-size:15px;font-weight:700}.h{font-size:19px;font-weight:700}.s{font-size:12.5px;fill:var(--muted)}.w{font-size:11.5px;font-weight:700}.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}.brd{fill:var(--board);stroke:var(--boardl);stroke-width:1.5}.pin{fill:var(--bg);stroke-width:1.6}</style>
<rect width="980" height="358" rx="14" fill="var(--bg)"/>
<text x="16" y="30" class="h">S3: RS485 transceiver (Modbus channels, beta)</text>
<text x="16" y="52" class="s">Only a 3.3 V module (MAX3485 / SP3485): a 5 V MAX485 drives 5 V into the ESP32</text>
<rect x="16" y="74" width="220" height="184" rx="10" class="brd"/>
<text x="30" y="96" class="t">ESP32-S3-DevKitC-1</text>
<text x="30" y="112" class="m">v1.0 N16R8 · J1 left, J3 right header</text>
<rect x="450" y="74" width="230" height="184" rx="10" class="box"/>
<text x="565.0" y="94" class="t" text-anchor="middle">RS485 module (3.3 V)</text>
<text x="565.0" y="110" class="m" text-anchor="middle">MAX3485 / SP3485, DE and RE bridged</text>
<text x="222" y="137.5" text-anchor="end">J1-1  3V3</text>
<line x1="236" y1="133.0" x2="450" y2="133.0" stroke="var(--3v3)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="133.0" r="4" class="pin" stroke="var(--3v3)"/>
<text x="343.0" y="128.0" class="w" text-anchor="middle" style="fill:var(--3v3)">3.3 V</text>
<circle cx="450" cy="133.0" r="4" class="pin" stroke="var(--3v3)"/>
<text x="462" y="137.5">VCC</text>
<text x="222" y="163.5" text-anchor="end">J3-1  GND</text>
<line x1="236" y1="159.0" x2="450" y2="159.0" stroke="var(--gnd)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="159.0" r="4" class="pin" stroke="var(--gnd)"/>
<circle cx="450" cy="159.0" r="4" class="pin" stroke="var(--gnd)"/>
<text x="462" y="163.5">GND</text>
<text x="222" y="189.5" text-anchor="end">J3-4  GPIO1</text>
<line x1="236" y1="185.0" x2="450" y2="185.0" stroke="var(--rs485)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="185.0" r="4" class="pin" stroke="var(--rs485)"/>
<text x="343.0" y="180.0" class="w" text-anchor="middle" style="fill:var(--rs485)">TX</text>
<circle cx="450" cy="185.0" r="4" class="pin" stroke="var(--rs485)"/>
<text x="462" y="189.5">DI</text>
<text x="222" y="215.5" text-anchor="end">J3-5  GPIO2</text>
<line x1="236" y1="211.0" x2="450" y2="211.0" stroke="var(--rs485)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="211.0" r="4" class="pin" stroke="var(--rs485)"/>
<text x="343.0" y="206.0" class="w" text-anchor="middle" style="fill:var(--rs485)">RX</text>
<circle cx="450" cy="211.0" r="4" class="pin" stroke="var(--rs485)"/>
<text x="462" y="215.5">RO</text>
<text x="222" y="241.5" text-anchor="end">J3-6  GPIO42</text>
<line x1="236" y1="237.0" x2="450" y2="237.0" stroke="var(--rs485)" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="236" cy="237.0" r="4" class="pin" stroke="var(--rs485)"/>
<text x="343.0" y="232.0" class="w" text-anchor="middle" style="fill:var(--rs485)">direction</text>
<circle cx="450" cy="237.0" r="4" class="pin" stroke="var(--rs485)"/>
<text x="462" y="241.5">DE + RE</text>
<rect x="800" y="74" width="165" height="184" rx="10" class="box"/>
<text x="882.5" y="94" class="t" text-anchor="middle">PMA KS 40-1 / 41-1 / 42-1</text>
<text x="882.5" y="110" class="m" text-anchor="middle">Modbus option, terminals 12–17</text>
<text x="668" y="137.5" text-anchor="end">A (+)</text>
<line x1="680" y1="133.0" x2="800" y2="133.0" stroke="var(--rs485)" stroke-width="2.6"/>
<circle cx="680" cy="133.0" r="4" class="pin" stroke="var(--rs485)"/>
<circle cx="800" cy="133.0" r="4" class="pin" stroke="var(--rs485)"/>
<text x="812" y="137.5">17 DATA A</text>
<text x="668" y="163.5" text-anchor="end">B (−)</text>
<line x1="680" y1="159.0" x2="800" y2="159.0" stroke="var(--rs485)" stroke-width="2.6"/>
<circle cx="680" cy="159.0" r="4" class="pin" stroke="var(--rs485)"/>
<circle cx="800" cy="159.0" r="4" class="pin" stroke="var(--rs485)"/>
<text x="812" y="163.5">15 DATA B</text>
<line x1="740" y1="185.0" x2="800" y2="185.0" stroke="var(--field)" stroke-width="2.6"/>
<text x="734" y="189.5" class="w" text-anchor="end" style="fill:var(--field)">not connected</text>
<circle cx="800" cy="185.0" r="4" class="pin" stroke="var(--field)"/>
<text x="812" y="189.5">13 RGND</text>
<text x="16" y="284" class="s">Two controllers share the A / B pair with their own addresses. No answer: swap A and B (harmless).</text>
<text x="16" y="302" class="s">No 120 Ω terminators below 8 devices at ≤ 9600 baud; the module needs fail-safe bias resistors. Twisted pair, screen grounded at one end.</text>
<text x="16" y="320" class="s">Auto-direction module: leave DE / RE open and set PIN_RS485_DE to -1 in src/board_s3.h.</text>
</svg>
